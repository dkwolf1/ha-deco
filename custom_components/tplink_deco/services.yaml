reboot_deco:
  name: Reboot Deco
  description: Reboot Deco
  fields:
    device_id:
      name: Device ID(s)
      description: Device ID(s)
      required: true
      selector:
        device:
          integration: tplink_deco
          manufacturer: TP-Link Deco
          multiple: true
set_client_blocked:
  name: Set client blocked (experimental)
  description: >-
    Set the Deco block list state for one client. Requires an administrator.
    Test only with a device you can safely disconnect.
  fields:
    config_entry_id:
      name: Deco
      description: Required when more than one Deco integration entry is loaded.
      selector:
        config_entry:
          integration: tplink_deco
    mac:
      name: Client MAC address
      required: true
      example: "02:00:00:00:00:01"
      selector:
        text:
    blocked:
      name: Block client
      description: Turn on to block the client; turn off to unblock it.
      required: true
      selector:
        boolean:
rename_client:
  name: Rename client (experimental)
  description: >-
    Change one connected client's name on the Deco. Requires an administrator
    and supported firmware. The Home Assistant entity ID is not changed.
  fields:
    config_entry_id:
      name: Deco
      description: Required when more than one Deco integration entry is loaded.
      selector:
        config_entry:
          integration: tplink_deco
    mac:
      name: Client MAC address
      required: true
      selector:
        text:
    name:
      name: New name
      description: A printable name, up to 32 UTF-8 bytes.
      required: true
      selector:
        text:
download_system_log:
  name: Download system log
  description: >-
    Save the Deco system log to the tplink_deco_logs folder of the Home
    Assistant config directory. Returns the file path and line count.
  fields:
    config_entry_id:
      name: Deco
      description: TP-Link Deco entry to download from. Required when more than one entry is loaded.
      required: false
      selector:
        config_entry:
          integration: tplink_deco
    filename:
      name: File name
      description: File name to save as. Defaults to deco-<timestamp>.log.
      required: false
      example: deco.log
      selector:
        text:
    log_level:
      name: Log level
      description: Minimum severity of log lines to include.
      required: false
      default: ALL
      selector:
        select:
          options:
            - ALERT
            - CRITICAL
            - ERROR
            - WARNING
            - NOTICE
            - INFO
            - DEBUG
            - ALL
