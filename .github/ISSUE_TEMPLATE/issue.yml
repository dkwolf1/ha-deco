name: Report an issue with TP-Link Deco
description: Report a reproducible problem with dkwolf1/ha-deco
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the [troubleshooting guide](https://github.com/dkwolf1/ha-deco/wiki/Troubleshooting) first.
        Report security vulnerabilities privately via the [security policy](https://github.com/dkwolf1/ha-deco/security/policy).
  - type: textarea
    validations:
      required: true
    attributes:
      label: Problem
      description: >-
        Describe the issue you are experiencing here, to communicate to the
        maintainers. Tell us what you were trying to do and what happened.

        Provide a clear and concise description of what the problem is.
  - type: markdown
    attributes:
      value: |
        # Environment
  - type: input
    validations:
      required: true
    attributes:
      label: TP-Link Deco Version
      placeholder: e.g. v3.15.4
  - type: input
    validations:
      required: true
    attributes:
      label: Home Assistant Version
      placeholder: e.g. 2026.11.1
  - type: input
    validations:
      required: true
    attributes:
      label: Deco Model, Hardware Revision and Firmware
      placeholder: e.g. X50 v1.0, firmware 1.8.0
  - type: markdown
    attributes:
      value: |
        # Details
  - type: textarea
    attributes:
      label: Sanitized Diagnostics or Relevant Logs
      description: >-
        Follow https://github.com/dkwolf1/ha-deco/wiki/Diagnostics-and-Bug-Reports.
        Remove credentials, session tokens and device identifiers. Do not attach raw Deco system logs.
