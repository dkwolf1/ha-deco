name: Feature request
description: Suggest an improvement to ha-deco
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe your use case and what you would like Home Assistant to do differently.
        If the feature depends on a particular Deco model or firmware, include those details.
  - type: textarea
    validations:
      required: true
    attributes:
      label: Feature Request
      description: >-
        A clear and concise description of the problem and what you want to happen.
  - type: textarea
    attributes:
      label: Alternatives
      description: >-
        A clear and concise description of any alternative solutions or features you've considered.
